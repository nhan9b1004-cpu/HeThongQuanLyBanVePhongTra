version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: phongtra-redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:-yourpassword} --appendonly yes --notify-keyspace-events Ex
    volumes:
      - redis_data:/data
      - ./database/redis/redis.conf:/usr/local/etc/redis/redis.conf
    restart: unless-stopped

volumes:
  redis_data: